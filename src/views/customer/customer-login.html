<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đăng nhập - ThuyR Mart</title>
    <link rel="stylesheet" href="/css/customer.css">
    <script src="https://unpkg.com/lucide@latest"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Manrope:wght@700;800&display=swap" rel="stylesheet">
</head>
<body style="margin: 0; padding: 0;">
    <div class="auth-wrapper">
        <!-- Sidebar Image -->
        <aside class="auth-aside" style="background-image: url('https://images.unsplash.com/photo-1497366216548-37526070297c?auto=format&fit=crop&q=80&w=2069');">
            <div class="auth-aside-content">
                <h2>Định hình tương lai.</h2>
                <p>Nền tảng quản lý chuyên nghiệp, thiết kế tối giản để tối đa hóa hiệu suất công việc của bạn.</p>
            </div>
        </aside>

        <!-- Main Login Form -->
        <main class="auth-main">
            <a href="/" class="auth-logo" style="display: flex; align-items: center; gap: 8px;">
                <img src="/img/logo.png" alt="Logo" style="height: 32px; width: 32px; border-radius: 50%; object-fit: cover;">
                <span style="color: var(--on-surface);">ThuyR Mart</span>
            </a>

            <div class="auth-form-container">
                <h1 class="auth-title">Chào mừng trở lại</h1>
                <p class="auth-subtitle">Hệ thống đăng nhập hợp nhất dành cho Khách hàng, Nhân viên và Admin.</p>

                <form id="login-form">
                    <div class="auth-form-group">
                        <label class="auth-form-label">Tài khoản (Số điện thoại / Username)</label>
                        <div class="input-icon-wrapper">
                            <i data-lucide="user" class="input-icon-left" style="width: 18px; height: 18px;"></i>
                            <input type="text" id="phone" class="auth-form-input" placeholder="0399501846 hoặc admin" required>
                        </div>
                    </div>

                    <div class="auth-form-group">
                        <label class="auth-form-label">Mật khẩu</label>
                        <div class="input-icon-wrapper has-right">
                            <i data-lucide="lock" class="input-icon-left" style="width: 18px; height: 18px;"></i>
                            <input type="password" id="password" class="auth-form-input" placeholder="••••••••" required>
                            <i data-lucide="eye-off" class="input-icon-right toggle-password" style="width: 18px; height: 18px;"></i>
                        </div>
                    </div>

                    <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 32px;">
                        <div class="auth-checkbox-group" style="margin-bottom: 0;">
                            <input type="checkbox" id="remember">
                            <label for="remember">Ghi nhớ tôi</label>
                        </div>
                        <a href="#" style="color: var(--primary); text-decoration: none; font-size: 13px; font-weight: 600;">Quên mật khẩu?</a>
                    </div>

                    <button type="submit" class="auth-btn">Đăng nhập</button>

                    <div class="auth-divider">
                        <span>HOẶC</span>
                    </div>

                    <button type="button" class="btn-google">
                        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                            <path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z" fill="#4285F4"/>
                            <path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" fill="#34A853"/>
                            <path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z" fill="#FBBC05"/>
                            <path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z" fill="#EA4335"/>
                        </svg>
                        Đăng nhập với Google
                    </button>

                    <div class="auth-footer">
                        Chưa có tài khoản? <a href="/register" id="link-register">Đăng ký ngay</a>
                    </div>
                </form>
            </div>
        </main>
    </div>

    <script>
        lucide.createIcons();

        // Toggle password visibility
        const toggleIcon = document.querySelector('.toggle-password');
        const passwordInput = document.getElementById('password');
        
        if (toggleIcon && passwordInput) {
            toggleIcon.addEventListener('click', () => {
                const type = passwordInput.getAttribute('type') === 'password' ? 'text' : 'password';
                passwordInput.setAttribute('type', type);
                
                // Toggle lucide icon name
                const currentIcon = toggleIcon.getAttribute('data-lucide');
                const newIcon = currentIcon === 'eye-off' ? 'eye' : 'eye-off';
                toggleIcon.setAttribute('data-lucide', newIcon);
                
                // Re-render icon
                lucide.createIcons();
            });
        }

        document.write('<script src="/js/customer.js"><\/script>');
    </script>
    <script>
        // Cập nhật link đăng ký để giữ nguyên redirect
        const urlParams = new URLSearchParams(window.location.search);
        const redirectUrl = urlParams.get('redirect');
        if (redirectUrl) {
            const regLink = document.getElementById('link-register');
            if (regLink) {
                regLink.href = '/register?redirect=' + encodeURIComponent(redirectUrl);
            }
        }

        document.getElementById('login-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const phone = document.getElementById('phone').value;
            const password = document.getElementById('password').value;
            
            try {
                const res = await fetch('/api/auth/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ phone, password })
                });
                const data = await res.json();
                
                if (data.success) {
                    localStorage.setItem('user', JSON.stringify(data.user)); // Unified user object
                    
                    if (data.user.role === 'admin' || data.user.role === 'staff') {
                        // Vẫn cho Admin redirect lại trang gốc nếu có, để admin cũng có thể đánh giá/mua hàng
                        if (redirectUrl) {
                            window.location.href = redirectUrl;
                        } else {
                            window.location.href = '/admin';
                        }
                    } else {
                        // customer
                        localStorage.setItem('customer', JSON.stringify(data.user)); // Keep customer specific item just in case
                        
                        if (redirectUrl) {
                            window.location.href = redirectUrl;
                        } else {
                            window.location.href = '/';
                        }
                    }
                } else {
                    alert('Đăng nhập thất bại: ' + data.message);
                }
            } catch (err) {
                console.error('Login error:', err);
                alert('Không thể kết nối đến máy chủ.');
            }
        });
    </script>
    <script src="/js/ai-chatbox.js"></script>
</body>
</html>
